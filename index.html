<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Course Registration Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="home">
    <h1>ABC Training Institute</h1>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#register">Register</a>
    <a href="#students">Students</a>
    <a href="#contact">Contact</a>
</nav>

<div class="container">

    <div class="card" id="register">

        <h2>Student Registration Form</h2>

        <form id="studentForm">

            <label>Full Name</label>
            <input type="text" id="name">

            <label>Email</label>
            <input type="email" id="email">

            <label>Mobile Number</label>
            <input type="text" id="mobile">

            <label>Gender</label>
            <div class="radio-group">
                <input type="radio" name="gender" value="Male"> Male
                <input type="radio" name="gender" value="Female"> Female
            </div>

            <label>Department</label>
            <input type="text" id="department">

            <label>Course</label>
            <select id="course">
                <option value="">Select Course</option>
                <option>Web Development</option>
                <option>Python</option>
                <option>Java</option>
                <option>AI</option>
            </select>

            <label>Skills</label>

            <div class="checkbox-group">
                <input type="checkbox" value="HTML"> HTML
                <input type="checkbox" value="CSS"> CSS
                <input type="checkbox" value="JavaScript"> JavaScript
                <input type="checkbox" value="Python"> Python
            </div>

            <label>Date of Birth</label>
            <input type="date" id="dob">

            <label>Address</label>
            <textarea id="address"></textarea>

            <div class="buttons">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>

        </form>

    </div>

    <div class="card" id="students">

        <h2>Registered Students</h2>

        <table id="studentTable">

            <tr>
                <th>Name</th>
                <th>Course</th>
                <th>Department</th>
            </tr>

        </table>

    </div>

</div>

<footer id="contact">
    <p>© 2026 ABC Training Institute</p>
</footer>

<script src="script.js"></script>

</body>
</html>
